<!--
  arch-diff interactive template (the `--html` path).
  The skill fills {{PLACEHOLDERS}} with the SAME Mermaid text used in the .md, writes this to a file,
  then publishes it with the Artifact tool (favicon e.g. 🏗️; title = "Arch diff — <plan>").
  This is BODY content only — the Artifact wrapper adds <!doctype>/<head>/<body>. Artifacts render
  <pre class="mermaid"> natively (no external libs; CSP blocks CDNs). Pan/zoom & tabs are inline JS.
  Delete the #after tab + button if no side-by-side "after" diagram was produced.
-->
<title>Arch diff — {{PLAN_TITLE}}</title>
<style>
  :root{ --bg:#f7f7f9; --surface:#fff; --ink:#1b1b1f; --ink2:#55555f; --line:#e3e3ea; --accent:#3a5bd9;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,Consolas,monospace; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#161619; --surface:#1e1e24; --ink:#ececef; --ink2:#adadb6; --line:#30303a; --accent:#8aa2f2; } }
  :root[data-theme="dark"]{ --bg:#161619; --surface:#1e1e24; --ink:#ececef; --ink2:#adadb6; --line:#30303a; --accent:#8aa2f2; }
  :root[data-theme="light"]{ --bg:#f7f7f9; --surface:#fff; --ink:#1b1b1f; --ink2:#55555f; --line:#e3e3ea; --accent:#3a5bd9; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  header{padding:20px 24px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:20px}
  .meta{font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
  .legend{font-size:13px;color:var(--ink2);margin-top:8px}
  .tabs{display:flex;gap:8px;padding:14px 24px 0;flex-wrap:wrap}
  .tab{font:inherit;font-size:13.5px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;
    background:var(--surface);color:var(--ink2);cursor:pointer}
  .tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  :root[data-theme="dark"] .tab.active{color:#10131c}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px 24px 0;font-size:12px;color:var(--ink2)}
  .toolbar button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink2);cursor:pointer}
  main{padding:14px 24px 40px}
  .view{display:none}
  .view.active{display:block}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.split{grid-template-columns:1fr}}
  .panel{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
  .panel h2{margin:0;padding:10px 16px;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--ink2)}
  .viewport{height:min(72vh,680px);overflow:hidden;cursor:grab;touch-action:none;background:
    repeating-linear-gradient(0deg,transparent,transparent 23px,var(--line) 24px),
    repeating-linear-gradient(90deg,transparent,transparent 23px,var(--line) 24px)}
  .split .viewport{height:min(60vh,520px)}
  .viewport:active{cursor:grabbing}
  .canvas{transform-origin:0 0;transition:transform .04s linear;padding:16px}
  .mermaid{display:inline-block}
  a.themetoggle{position:fixed;top:14px;right:14px;font-family:var(--mono);font-size:12px;color:var(--ink2);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
</style>

<button class="themetoggle" onclick="var r=document.documentElement;var d=(r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';r.setAttribute('data-theme',d?'light':'dark')">◐ theme</button>

<header>
  <h1>Architecture diff — {{PLAN_TITLE}}</h1>
  <div class="meta">{{DATE}} · branch {{BRANCH}} · {{COUNTS}}</div>
  <div class="legend">🟩 added · 🟨 changed · 🟥 removed (dashed) · ⬜ unchanged</div>
</header>

<div class="tabs">
  <button class="tab active" data-view="delta">Delta (change)</button>
  <button class="tab" data-view="current">Current</button>
  <button class="tab" data-view="after">Before / After</button>
</div>
<div class="toolbar"><span>scroll = zoom · drag = pan</span><button class="reset">reset view</button></div>

<main>
  <div class="view active" id="delta">
    <div class="panel"><h2>Planned change</h2>
      <div class="viewport"><div class="canvas"><pre class="mermaid">
{{DELTA_MERMAID}}
</pre></div></div>
    </div>
  </div>

  <div class="view" id="current">
    <div class="panel"><h2>Current architecture</h2>
      <div class="viewport"><div class="canvas"><pre class="mermaid">
{{CURRENT_MERMAID}}
</pre></div></div>
    </div>
  </div>

  <div class="view" id="after">
    <div class="split">
      <div class="panel"><h2>Before</h2>
        <div class="viewport"><div class="canvas"><pre class="mermaid">
{{CURRENT_MERMAID}}
</pre></div></div>
      </div>
      <div class="panel"><h2>After</h2>
        <div class="viewport"><div class="canvas"><pre class="mermaid">
{{AFTER_MERMAID}}
</pre></div></div>
      </div>
    </div>
  </div>
</main>

<script>
  // tabs
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.view).classList.add('active');
  }));
  // pan + zoom per viewport (operates on the container, robust to async mermaid render)
  document.querySelectorAll('.viewport').forEach(vp=>{
    const cv=vp.querySelector('.canvas'); let s=1,x=0,y=0,drag=false,px=0,py=0;
    const apply=()=>cv.style.transform=`translate(${x}px,${y}px) scale(${s})`;
    vp.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY<0?1.12:0.89;s=Math.min(5,Math.max(0.25,s*d));apply();},{passive:false});
    vp.addEventListener('pointerdown',e=>{drag=true;px=e.clientX-x;py=e.clientY-y;vp.setPointerCapture(e.pointerId);});
    vp.addEventListener('pointermove',e=>{if(drag){x=e.clientX-px;y=e.clientY-py;apply();}});
    vp.addEventListener('pointerup',()=>drag=false);
    vp.addEventListener('pointercancel',()=>drag=false);
  });
  document.querySelector('.reset').addEventListener('click',()=>{
    document.querySelectorAll('.canvas').forEach(cv=>cv.style.transform='translate(0,0) scale(1)');
  });
</script>
